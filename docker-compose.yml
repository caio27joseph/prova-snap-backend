# Dev/test PostgreSQL — the API itself runs locally via uvicorn (see README).
# Single instance hosts both the dev DB (prova) and the test DB (prova_test):
# one `docker compose up -d` is the only prerequisite for running AND testing.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prova
      POSTGRES_PASSWORD: prova
      POSTGRES_DB: prova
    ports:
      # Host port is overridable (.env: POSTGRES_PORT) for machines where 5432
      # is taken by another Postgres; default stays the standard 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs only on first init of an empty volume; conftest.py re-creates
      # prova_test if missing, so a pre-existing volume is not a problem
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prova -d prova"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observability stack (T-13, Parte 4 melhoria nº 3) ---------------------
  # Both services sit behind the `observability` profile so the evaluator flow
  # is untouched: a plain `docker compose up -d` still starts ONLY postgres.
  # Opt in with: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports:
      # Same override pattern as POSTGRES_PORT: set PROMETHEUS_PORT in .env
      # when 9090 is taken on this machine.
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The API runs on the HOST via uvicorn (there is no app container);
    # host-gateway lets the container scrape it at host.docker.internal —
    # see docker/prometheus.yml for the target and its caveats.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Fully provisioned (datasource + dashboard baked in): opening
      # localhost:3000 (admin/admin) already shows the search-api dashboard,
      # no manual clicking. Dashboards are read from docker/grafana/dashboards.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
